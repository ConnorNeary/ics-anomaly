experiment: dissertation-multiseed
description: >
  Phase 1 reproduction target. Same models, hyperparameters, seeds and
  tuning as the dissertation's train_multiseed.py + baselines.py:
  small AE x5 seeds, small CNN and LSTM x3 seeds (history 30), k-means and
  IsolationForest at seed 42, tau/w tuned for range-F1 on attack-val.
  Compare against the dissertation's CSVs with scripts/compare_dissertation.py.

data:
  dataset: swat2015
  dir: data/swat2015
  features: ks_filtered

split:
  train_frac: 0.7
  attack_val_frac: 0.3
  block_size: 14400

train:
  epochs: 50
  batch_size: 512
  patience: 5
  val_batch_size: null      # whole benign-val set per pass, as the dissertation did

detection:
  tuning_metric: range_f1
  aggregation: mean

runtime:
  device: cpu               # the dissertation ran on CPU; GPU results are not bit-identical
  deterministic: false

models:
  - name: ae
    params: {enc_dim: 16}
    seeds: [42, 43, 44, 45, 46]
  - name: cnn
    params: {history: 30}
    seeds: [42, 43, 44]
  - name: lstm
    params: {history: 30, latent_dim: 32, num_layers: 1}
    seeds: [42, 43, 44]
  - name: kmeans
    params: {k_range: [2, 3, 4, 5, 6, 8, 10, 15]}
    seeds: [42]
  - name: iforest
    params: {n_estimators: 100}
    seeds: [42]
